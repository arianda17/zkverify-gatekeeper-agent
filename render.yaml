services:
  - type: web
    name: wowok-gatekeeper
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: VK_HASH_MODE
        value: modp
      - key: TASK_ID_MODE
        value: keccak
      - key: AGENT_GAMES_HMAC_SECRET
        sync: false
    healthCheckPath: /
